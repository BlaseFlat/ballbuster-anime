<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#89a}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/","@pixiv/three-vrm":"../../vendor/three-vrm/three-vrm.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
const q = new URLSearchParams(location.search);
const files = (q.get('f')||'').split(',');
const base = q.get('base') || '../../../bba_src/vrm/';
const R = new THREE.WebGLRenderer({antialias:true}); R.setSize(innerWidth, innerHeight); document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x9ab0c8);
const cam = new THREE.PerspectiveCamera(q.get('fov')?+q.get('fov'):30, innerWidth/innerHeight, 0.05, 100);
S.add(new THREE.AmbientLight(0xffffff, 0.6)); const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(1,2,2); S.add(dl);
const L = new GLTFLoader(); L.register(p => new VRMLoaderPlugin(p));
window.info = [];
const sp = 0.9;
let i=0;
for (const f of files) {
  const g = await L.loadAsync(base + f); const vrm = g.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  vrm.scene.position.x = (i - (files.length-1)/2) * sp; S.add(vrm.scene);
  // relax arms
  const h = vrm.humanoid;
  h.getNormalizedBoneNode('leftUpperArm').rotation.z = 1.2; h.getNormalizedBoneNode("rightUpperArm").rotation.z = -1.2;
  if (q.get('expr')) for (const kv of q.get('expr').split(',')) { const [k,v]=kv.split(':'); vrm.expressionManager.setValue(k, +v); }
  vrm.update(0);
  const box = new THREE.Box3().setFromObject(vrm.scene);
  let tris=0, mats=new Set(), meshes=[]; vrm.scene.traverse(o=>{ if(o.isMesh){ tris+=o.geometry.index?o.geometry.index.count/3:0; [].concat(o.material).forEach(m=>mats.add(m.name)); meshes.push(o.name);} });
  window.info.push({f, meta: vrm.meta && (vrm.meta.name||vrm.meta.title), metaVersion: vrm.meta?.metaVersion, h: +(box.max.y-box.min.y).toFixed(3), tris, mats:[...mats], meshes, expr: Object.keys(vrm.expressionManager?.expressionMap||{})});
  i++;
}
const mode = q.get('mode')||'full';
if (mode==='full'){ const w=files.length*sp; cam.position.set(0,0.9, Math.max(3.2, w*1.9)); cam.lookAt(0,0.85,0);} 
else { cam.position.set(0,1.35,1.3); cam.lookAt(0,1.3,0); }
if (q.get('cam')) { const c=q.get('cam').split(',').map(Number); cam.position.set(c[0],c[1],c[2]); cam.lookAt(c[3],c[4],c[5]); }
R.render(S,cam); window.done=true;
</script></body></html>
